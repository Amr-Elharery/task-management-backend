openapi: 3.0.0

info:
  title: Task Management API
  version: 1.0.0
  description: REST API for task management

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Authentication
    description: User authentication endpoints

  - name: Users
    description: User endpoints

  - name: Tasks
    description: Task management endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 66c123456789abcdef123456

        name:
          type: string
          example: Amr

        email:
          type: string
          format: email
          example: amr@example.com

        createdAt:
          type: string
          format: date-time
          example: 2026-08-21T10:00:00.000Z

        updatedAt:
          type: string
          format: date-time
          example: 2026-08-21T10:00:00.000Z

    Task:
      type: object
      properties:
        _id:
          type: string
          example: 66c123456789abcdef123456

        user:
          type: string
          example: 66c123456789abcdef123456

        title:
          type: string
          example: Finish technical assessment

        description:
          type: string
          example: Complete the MERN task management application

        status:
          type: string
          enum:
            - To Do
            - In Progress
            - Done
          example: In Progress

        priority:
          type: string
          enum:
            - Low
            - Medium
            - High
          example: High

        dueDate:
          type: string
          format: date-time
          example: 2026-08-25T18:00:00.000Z

        createdAt:
          type: string
          format: date-time
          example: 2026-08-21T10:00:00.000Z

        updatedAt:
          type: string
          format: date-time
          example: 2026-08-21T10:00:00.000Z

    Error:
      type: object
      properties:
        error:
          type: string
          example: Something went wrong.

paths:
  # =========================
  # Authentication
  # =========================

  /api/auth/register:
    post:
      tags:
        - Authentication

      summary: Register a new user

      description: Creates a new user account.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - name
                - email
                - password

              properties:
                name:
                  type: string
                  example: Amr

                email:
                  type: string
                  format: email
                  example: amr@example.com

                password:
                  type: string
                  format: password
                  example: password123

      responses:
        '201':
          description: User registered successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  user:
                    $ref: '#/components/schemas/User'

        '400':
          description: Missing required fields

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

              example:
                error: Name, email, and password are required.

  /api/auth/login:
    post:
      tags:
        - Authentication

      summary: Login a user

      description: Authenticates a user and returns a JWT. The JWT is also stored in an HttpOnly cookie.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - password

              properties:
                email:
                  type: string
                  format: email
                  example: amr@example.com

                password:
                  type: string
                  format: password
                  example: password123

      responses:
        '200':
          description: Login successful

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Login successful.

                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        '400':
          description: Missing required fields

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

              example:
                error: Email and password are required.

        '401':
          description: Invalid email or password

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

              example:
                error: Invalid email or password

  /api/auth/logout:
    post:
      tags:
        - Authentication

      summary: Logout the current user

      description: Clears the authentication cookie.

      security:
        - bearerAuth: []
        - cookieAuth: []

      responses:
        '200':
          description: Logout successful

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Logged out successfully.

        '401':
          description: Authentication token is missing, invalid, or expired

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

              examples:
                missingToken:
                  value:
                    error: Authentication token is required.

                invalidToken:
                  value:
                    error: Invalid or expired token.

  # =========================
  # Users
  # =========================

  /api/user/me:
    get:
      tags:
        - Users

      summary: Get current authenticated user

      description: Returns the profile of the currently authenticated user.

      security:
        - bearerAuth: []
        - cookieAuth: []

      responses:
        '200':
          description: Current user retrieved successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  user:
                    $ref: '#/components/schemas/User'

        '401':
          description: Authentication token is missing, invalid, or expired

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================
  # Tasks
  # =========================

  /api/tasks:
    post:
      tags:
        - Tasks

      summary: Create a task

      description: Creates a new task for the authenticated user.

      security:
        - bearerAuth: []
        - cookieAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - title
                - description
                - status
                - priority
                - dueDate

              properties:
                title:
                  type: string
                  example: Finish technical assessment

                description:
                  type: string
                  example: Complete the MERN task management application

                status:
                  type: string
                  enum:
                    - To Do
                    - In Progress
                    - Done
                  example: To Do

                priority:
                  type: string
                  enum:
                    - Low
                    - Medium
                    - High
                  example: High

                dueDate:
                  type: string
                  format: date-time
                  example: 2026-08-25T18:00:00.000Z

      responses:
        '201':
          description: Task created successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Task added successfully.

                  task:
                    $ref: '#/components/schemas/Task'

        '400':
          description: Invalid task data

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Authentication required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Tasks

      summary: Get current user's tasks

      description: Returns tasks belonging only to the authenticated user. Tasks can be filtered by status and priority.

      security:
        - bearerAuth: []
        - cookieAuth: []

      parameters:
        - name: status
          in: query
          required: false

          schema:
            type: string
            enum:
              - To Do
              - In Progress
              - Done

          description: Filter tasks by status.

        - name: priority
          in: query
          required: false

          schema:
            type: string
            enum:
              - Low
              - Medium
              - High

          description: Filter tasks by priority.

      responses:
        '200':
          description: Tasks retrieved successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Tasks retrieved successfully.

                  tasks:
                    type: array

                    items:
                      $ref: '#/components/schemas/Task'

        '400':
          description: Invalid query parameters

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Authentication required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tasks/search:
    get:
      tags:
        - Tasks

      summary: Search tasks by title

      description: Searches the authenticated user's tasks by title using a case-insensitive match.

      security:
        - bearerAuth: []
        - cookieAuth: []

      parameters:
        - name: title
          in: query
          required: true

          schema:
            type: string

          description: Title text to search for.

          example: assessment

      responses:
        '200':
          description: Tasks retrieved successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Tasks retrieved successfully.

                  tasks:
                    type: array

                    items:
                      $ref: '#/components/schemas/Task'

        '400':
          description: Title query parameter is required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

              example:
                error: Title query parameter is required.

        '401':
          description: Authentication required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tasks/{id}:
    get:
      tags:
        - Tasks

      summary: Get a task by ID

      description: Returns a task belonging to the authenticated user.

      security:
        - bearerAuth: []
        - cookieAuth: []

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string

          description: Task ID.

          example: 66c123456789abcdef123456

      responses:
        '200':
          description: Task retrieved successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Task retrieved successfully.

                  task:
                    $ref: '#/components/schemas/Task'

        '401':
          description: Authentication required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '403':
          description: Unauthorized access to the task

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Task not found

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Tasks

      summary: Update a task

      description: Updates an existing task belonging to the authenticated user.

      security:
        - bearerAuth: []
        - cookieAuth: []

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string

          description: Task ID.

          example: 66c123456789abcdef123456

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                title:
                  type: string
                  example: Updated task title

                description:
                  type: string
                  example: Updated task description

                status:
                  type: string
                  enum:
                    - To Do
                    - In Progress
                    - Done

                priority:
                  type: string
                  enum:
                    - Low
                    - Medium
                    - High

                dueDate:
                  type: string
                  format: date-time
                  example: 2026-08-30T18:00:00.000Z

      responses:
        '200':
          description: Task updated successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Task updated successfully.

                  task:
                    $ref: '#/components/schemas/Task'

        '400':
          description: Invalid task data

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Authentication required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '403':
          description: Unauthorized access to the task

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Task not found

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Tasks

      summary: Delete a task

      description: Deletes a task belonging to the authenticated user.

      security:
        - bearerAuth: []
        - cookieAuth: []

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string

          description: Task ID.

          example: 66c123456789abcdef123456

      responses:
        '200':
          description: Task deleted successfully

          content:
            application/json:
              schema:
                type: object

                properties:
                  message:
                    type: string
                    example: Task deleted successfully.

        '401':
          description: Authentication required

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '403':
          description: Unauthorized access to the task

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Task not found

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
